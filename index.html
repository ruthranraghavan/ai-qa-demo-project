<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo E-Commerce App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Gadget Store</h1>
            <div id="login-status">Not Logged In</div>
        </header>

        <main>
            <!-- Login Section -->
            <section id="login-section">
                <h2>Login</h2>
                <form id="login-form">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit" id="login-btn">Login</button>
                </form>
                <p id="login-error" class="hidden">Invalid credentials!</p>
            </section>

            <!-- Product Section -->
            <section id="product-section" class="hidden">
                <h2>Products</h2>
                <div class="product-list">
                    <div class="product" data-id="1">
                        <h3>Laptop</h3>
                        <p>$999</p>
                        <button class="add-to-cart">Add to Cart</button>
                    </div>
                    <div class="product" data-id="2">
                        <h3>Smartphone</h3>
                        <p>$499</p>
                        <!-- UI INCONSISTENCY: This button is styled differently or has a typo -->
                        <button class="add-to-cart-typo">Add to Cart (Typo)</button>
                    </div>
                </div>
            </section>

            <!-- Cart Section -->
            <section id="cart-section" class="hidden">
                <h2>Your Cart</h2>
                <ul id="cart-items"></ul>
                <button id="checkout-btn">Checkout</button>
            </section>

            <section id="success-section" class="hidden">
                <h2>Thank you for your purchase!</h2>
                <button id="back-home">Back to Products</button>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
